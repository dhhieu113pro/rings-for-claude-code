[package]
name = "claude-usage-widget"
version = "0.5.1"
edition = "2021"

[lib]
name = "claude_usage_widget"
path = "src/lib.rs"

[[bin]]
name = "claude-usage-widget"
path = "src/main.rs"

[[bin]]
name = "claude-usage-manager"
path = "src/bin/claude-usage-manager.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
windows-numerics = "0.3"
windows-reactor = "0.100"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
